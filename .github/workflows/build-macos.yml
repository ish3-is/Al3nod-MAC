name: Build ISHARA for macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai/**"
      - "assets/**"
      - "core/**"
      - "ui/**"
      - "tests/**"
      - "tools/**"
      - "main.py"
      - "config.py"
      - "requirements-macos.txt"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS 15 ARM64 application
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out ISHARA
        uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Set up Python 3.11 ARM64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: arm64
          cache: pip
          cache-dependency-path: requirements-macos.txt

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --only-binary=:all: -r requirements-macos.txt

      - name: Verify native imports and source model
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform
          import cv2
          import mediapipe
          import numpy
          import onnxruntime
          import PySide6

          assert platform.machine() == "arm64", platform.machine()
          print("Python architecture:", platform.machine())
          print("PySide6:", PySide6.__version__)
          print("OpenCV:", cv2.__version__)
          print("MediaPipe:", mediapipe.__version__)
          print("ONNX Runtime:", onnxruntime.__version__)
          print("NumPy:", numpy.__version__)
          PY
          python main.py --verify-runtime

      - name: Run camera-independent tests
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build ISHARA.app
        shell: bash
        run: |
          set -euo pipefail
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onedir \
            --name ISHARA \
            --target-arch arm64 \
            --osx-bundle-identifier sa.edu.ishara.cashier \
            --hidden-import ui.pyside_app \
            --hidden-import ui.tk_fallback \
            --hidden-import ai.models.feats \
            --exclude-module pkg_resources \
            --collect-all mediapipe \
            --collect-all onnxruntime \
            --copy-metadata mediapipe \
            --copy-metadata onnxruntime \
            --add-data "ai/models:ai/models" \
            --add-data "assets:assets" \
            main.py
          test -d dist/ISHARA.app

      - name: Add camera privacy metadata
        shell: bash
        run: |
          set -euo pipefail
          PLIST="dist/ISHARA.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string ISHARA uses the camera to detect hand, face, and body landmarks for sign-language recognition." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :LSMinimumSystemVersion" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 13.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSHighResolutionCapable" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST"
          plutil -lint "$PLIST"

      - name: Ad-hoc sign and verify application bundle
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          set -euo pipefail
          codesign --force --deep --sign - dist/ISHARA.app
          codesign --verify --deep --strict --verbose=2 dist/ISHARA.app
          python tools/verify_macos_bundle.py dist/ISHARA.app

      - name: Upload verification diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ISHARA-macOS-M2-diagnostics
          path: |
            artifacts/bundled_runtime_verification.json
            build/ISHARA/warn-ISHARA.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Create distributable ZIP and report
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent dist/ISHARA.app ISHARA-macOS-M2.zip
          unzip -t ISHARA-macOS-M2.zip
          python tools/write_macos_build_report.py
          cat artifacts/MACOS_BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS M2 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: ISHARA-macOS-M2
          path: |
            ISHARA-macOS-M2.zip
            artifacts/macos_build_verification.json
            artifacts/MACOS_BUILD_REPORT.md
            build/ISHARA/warn-ISHARA.txt
          if-no-files-found: error
          retention-days: 30
